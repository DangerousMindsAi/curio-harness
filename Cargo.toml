[workspace]
resolver = "3"
members = ["crates/curio-core", "crates/curio-builtins", "crates/curio-host"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
curio-core = { path = "crates/curio-core" }
curio-builtins = { path = "crates/curio-builtins" }
async-trait = "0.1"
futures = "0.3"
humantime = "2"
libc = "0.2"
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
